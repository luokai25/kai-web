<style>
:root{--bg:#0E1219;--bg2:#141820;--surface:#1A2030;--surface2:#1F2740;--line:#2A3348;--lsoft:#1E2840;--text:#E8E4DC;--dim:#6B7A96;--mid:#9BA8BC;--accent:#E8A93C;--asoft:#2A2010;--ybg:#1E2A40;--danger:#E05252;--dsoft:#2A1414;--green:#4CAF7A;--gsoft:#142A1E;--blue:#5B8DEF;--purple:#9B72CF;--r:14px;--sh:0 2px 8px rgba(0,0,0,.4),0 16px 40px -12px rgba(0,0,0,.6);}
*{box-sizing:border-box;margin:0;padding:0;}html,body{height:100%;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overscroll-behavior:none;}
header{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:54px;border-bottom:1px solid var(--line);background:var(--bg2);position:sticky;top:0;z-index:20;flex-shrink:0;}
.brand{display:flex;align-items:center;gap:11px;}
.bg{width:32px;height:32px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:18px;color:#0E1219;flex-shrink:0;transition:box-shadow .3s;}
.bg.pulse{box-shadow:0 0 0 6px var(--asoft);}
.bn{font-family:'DM Serif Display',serif;font-size:18px;letter-spacing:-.01em;}
.bs{font-size:10.5px;color:var(--dim);margin-top:2px;letter-spacing:.03em;}
.hr{display:flex;align-items:center;gap:8px;}
.sp{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 7px;font-size:11px;color:var(--dim);}
.sd{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--asoft),0 0 8px var(--accent);transition:all .3s;}
.sd.off{background:var(--danger);box-shadow:0 0 0 2px var(--dsoft);}
.sd.thinking{background:var(--blue);box-shadow:0 0 0 2px rgba(91,141,239,.2),0 0 8px var(--blue);animation:sp 1s infinite;}
@keyframes sp{0%,100%{opacity:1}50%{opacity:.3}}
.ib{width:34px;height:34px;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--dim);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;flex-shrink:0;}
.ib:hover{background:var(--surface);border-color:var(--accent);color:var(--accent);}
.ib.on{background:var(--asoft);border-color:var(--accent);color:var(--accent);}
.av{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);overflow:hidden;cursor:pointer;background:var(--asoft);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:14px;color:var(--accent);flex-shrink:0;}
.av img{width:100%;height:100%;object-fit:cover;display:none;}
#am{position:absolute;top:60px;right:16px;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);min-width:220px;padding:8px;display:none;}
#am.open{display:block;}
.ar{display:flex;align-items:center;gap:10px;padding:8px 8px 12px;border-bottom:1px solid var(--lsoft);margin-bottom:6px;}
.ar img{width:34px;height:34px;border-radius:50%;}
.an{font-size:13px;font-weight:600;}.ae{font-size:11.5px;color:var(--dim);}
.mb{width:100%;text-align:left;background:none;border:none;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--mid);cursor:pointer;font-family:inherit;display:block;}
.mb:hover{background:var(--surface2);color:var(--text);}
#sob{color:var(--danger);}#sob:hover{background:var(--dsoft);}
#lo{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;padding:40px 28px;text-align:center;}
.lg{width:72px;height:72px;border-radius:22px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-family:'DM Serif Display',serif;font-size:36px;color:#0E1219;margin-bottom:28px;box-shadow:0 0 0 8px var(--asoft),0 20px 40px -12px rgba(232,169,60,.3);}
.lt{font-family:'DM Serif Display',serif;font-size:30px;margin-bottom:10px;}
.ls{color:var(--dim);font-size:14px;line-height:1.6;max-width:320px;margin-bottom:34px;}
#gsb{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--surface);color:var(--text);border:1px solid var(--line);padding:13px 24px;border-radius:999px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;}
#gsb:hover{border-color:var(--accent);background:var(--surface2);}
#gsb svg{width:18px;height:18px;flex-shrink:0;}
#lst{margin-top:14px;font-size:12px;color:var(--accent);min-height:16px;}
.gl{margin-top:16px;background:none;border:none;color:var(--dim);font-size:12.5px;text-decoration:underline;cursor:pointer;font-family:inherit;}
.ll{margin-top:28px;font-size:11px;color:var(--dim);max-width:280px;line-height:1.5;}
#app{flex:1;display:flex;flex-direction:column;min-height:0;}
#chat{flex:1;overflow-y:auto;padding:24px 20px 8px;max-width:780px;width:100%;margin:0 auto;scroll-behavior:smooth;}
#chat::-webkit-scrollbar{width:4px;}#chat::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
.row{margin-bottom:18px;max-width:88%;}.row.kai{margin-right:auto;}.row.you{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;}.row.sr{margin:0 auto 14px;max-width:100%;}
.mt{font-size:10.5px;color:var(--dim);margin-bottom:5px;padding:0 3px;letter-spacing:.02em;}
.bubble{font-size:14.5px;line-height:1.68;white-space:pre-wrap;word-wrap:break-word;}
.row.kai .bubble{background:transparent;color:var(--text);padding:0 2px;}
.row.you .bubble{background:var(--ybg);border:1px solid var(--line);padding:11px 15px;border-radius:14px 14px 4px 14px;}
.typing{display:flex;gap:5px;padding:13px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:fit-content;}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--dim);animation:pu 1.3s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}.typing span:nth-child(3){animation-delay:.4s;}
@keyframes pu{0%,80%,100%{opacity:.2;transform:scale(.9)}40%{opacity:1;transform:scale(1)}}
.bimg{max-width:100%;border-radius:10px;margin-top:8px;display:block;border:1px solid var(--line);cursor:zoom-in;}
.bwrap{position:relative;display:inline-block;}
.bdl{position:absolute;top:8px;right:8px;background:rgba(14,18,25,.82);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11px;color:var(--mid);text-decoration:none;backdrop-filter:blur(8px);}
.bcode{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:6px;overflow-x:auto;line-height:1.65;white-space:pre;position:relative;}
.bcode .ltag{font-size:10px;color:var(--dim);letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;display:block;}
.bcode .cc{position:absolute;top:10px;right:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:11px;cursor:pointer;color:var(--mid);}
.bcode .cc:hover{border-color:var(--accent);color:var(--accent);}
.bwiki{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-top:6px;font-size:13.5px;line-height:1.6;}
.bwiki .wt{font-weight:600;color:var(--accent);margin-bottom:5px;font-size:13px;}
.bwiki a{font-size:11.5px;color:var(--blue);margin-top:6px;display:block;}
.bwx{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:6px;display:flex;align-items:flex-start;gap:14px;}
.wi{font-size:38px;line-height:1;flex-shrink:0;}.wt2{font-size:26px;font-weight:600;}.wd{font-size:13px;color:var(--mid);margin-top:2px;}.wl{font-size:11px;color:var(--dim);margin-top:4px;}.wdt{display:flex;gap:12px;margin-top:8px;font-size:12px;color:var(--dim);}
.bcur{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:13px 15px;margin-top:6px;}.cr{font-size:22px;font-weight:600;color:var(--accent);}.cs{font-size:12px;color:var(--dim);margin-top:3px;}
.sysm{text-align:center;font-size:11.5px;color:var(--dim);padding:4px 13px;background:var(--surface);border:1px solid var(--line);border-radius:999px;width:fit-content;margin:0 auto;}
.bvid{position:relative;margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#000;max-width:100%;}
.bvid video{width:100%;display:block;border-radius:9px;}
.bvid-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);}
.bvid-spinner{width:40px;height:40px;border:3px solid rgba(232,169,60,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.bvid-dl{position:absolute;top:8px;right:8px;background:rgba(14,18,25,.82);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11px;color:var(--mid);text-decoration:none;backdrop-filter:blur(8px);}
.vid-meta{font-size:11.5px;color:var(--dim);margin-top:6px;display:flex;gap:10px;}
.vid-model-badge{background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:10px;color:var(--mid);letter-spacing:.04em;}
.sug-row{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0 10px;}
.sug-btn{background:var(--asoft);border:1px solid var(--accent);color:var(--accent);padding:5px 12px;border-radius:999px;font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;}
.sug-btn:hover{background:var(--accent);color:#0E1219;}
#cw{padding:8px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 28%);flex-shrink:0;max-width:780px;width:100%;margin:0 auto;}
#qc{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;}#qc::-webkit-scrollbar{display:none;}
#qc button{flex:0 0 auto;background:var(--surface);border:1px solid var(--line);color:var(--mid);padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap;}
#qc button:hover{border-color:var(--accent);color:var(--accent);background:var(--asoft);}
#comp{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 10px 10px 18px;box-shadow:var(--sh);transition:border-color .2s;}
#comp:focus-within{border-color:var(--accent);}
#inp{flex:1;border:none;outline:none;resize:none;background:transparent;font-family:'DM Sans',sans-serif;font-size:14.5px;line-height:1.5;color:var(--text);max-height:120px;padding:3px 0;}
#inp::placeholder{color:var(--dim);}
.ca{display:flex;gap:6px;align-items:center;flex-shrink:0;}
#mic,#img2,#send{border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
#mic{width:34px;height:34px;background:var(--surface2);color:var(--dim);font-size:9px;font-family:inherit;font-weight:700;letter-spacing:.05em;}
#mic.L{background:var(--dsoft);color:var(--danger);}
#img2{width:34px;height:34px;background:var(--surface2);color:var(--dim);font-size:16px;}
#img2.on{background:var(--purple);color:#fff;}
#send{width:36px;height:36px;background:var(--accent);color:#0E1219;font-size:18px;font-weight:700;border-radius:12px;}
#send:hover:not(:disabled){transform:scale(1.05);}#send:disabled{opacity:.4;cursor:default;}
.panel{position:fixed;top:0;right:0;height:100%;width:min(360px,94vw);z-index:50;background:var(--bg2);border-left:1px solid var(--line);transform:translateX(110%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-16px 0 40px -8px rgba(0,0,0,.5);}
.panel.open{transform:translateX(0);}
.ph{display:flex;align-items:center;justify-content:space-between;padding:0 18px;height:54px;border-bottom:1px solid var(--line);flex-shrink:0;}
.ph h2{font-family:'DM Serif Display',serif;font-size:18px;font-weight:400;}
.pc{background:none;border:none;font-size:20px;color:var(--dim);cursor:pointer;line-height:1;padding:4px;}
.pb{flex:1;overflow-y:auto;padding:20px 18px;}
.fg{margin-bottom:20px;}
.fl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:8px;display:block;}
.fi{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-family:inherit;color:var(--text);outline:none;transition:border-color .15s;}
.fi:focus{border-color:var(--accent);}
.sb{width:100%;text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--mid);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:8px;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:space-between;}
.sb:hover{border-color:var(--accent);color:var(--text);}
#wb{color:var(--danger);border-color:var(--dsoft);}#wb:hover{background:var(--dsoft);}
#ms{font-size:12.5px;line-height:2.1;color:var(--dim);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}#ms b{color:var(--text);font-weight:500;}
.tr2{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;}
.tl{font-size:13px;color:var(--mid);}
.tg{width:36px;height:20px;border-radius:999px;background:var(--line);border:none;cursor:pointer;position:relative;transition:background .2s;}
.tg.on{background:var(--accent);}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .2s;}
.tg.on::after{transform:translateX(16px);}
.ti{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;}
.ti.dn{opacity:.5;}
.tc{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;transition:all .15s;margin-top:1px;}
.tc.ck{background:var(--green);border-color:var(--green);color:#fff;}
.tt{flex:1;font-size:13.5px;line-height:1.4;}.tm{font-size:11px;color:var(--dim);margin-top:3px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.db{padding:1px 6px;border-radius:4px;font-size:10.5px;background:var(--surface2);border:1px solid var(--line);}
.db.ov{background:var(--dsoft);border-color:var(--danger);color:var(--danger);}.db.td{background:var(--asoft);border-color:var(--accent);color:var(--accent);}
.pb2{padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:.04em;}
.pb2.high{background:var(--dsoft);color:var(--danger);}.pb2.medium{background:var(--asoft);color:var(--accent);}.pb2.low{background:var(--gsoft);color:var(--green);}
.hs{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;}
.hd{font-size:11px;color:var(--dim);}.hp{font-size:13px;color:var(--mid);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s;}.bd.open{opacity:1;pointer-events:auto;}
#lk{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;}
#lk h2{font-family:'DM Serif Display',serif;font-size:22px;}
#lki{padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;width:240px;text-align:center;color:var(--text);font-family:inherit;outline:none;}#lki:focus{border-color:var(--accent);}
#lkb{background:var(--accent);color:#0E1219;border:none;padding:10px 28px;border-radius:12px;font-weight:600;cursor:pointer;font-family:inherit;font-size:14px;}
#lke{display:none;color:var(--danger);font-size:12.5px;}
#im{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;}#im.open{display:flex;}#im img{max-width:100%;max-height:90vh;border-radius:12px;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:13px;color:var(--mid);z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;}#toast.show{opacity:1;}
.kbd{font-family:'JetBrains Mono',monospace;font-size:10px;background:var(--surface2);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--dim);}
@media(min-width:640px){.row{max-width:76%;}}@media(max-width:480px){.bs{display:none;}}
</style>
</head>
<body>SEE_FULL_FILE_IN_CONTAINER</body>
</html>
